<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angle Drop</title>
<style>
:root{--bg:#f4f5f7;--fg:#1c2230;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--fg:#e8ecf5;--card:#171e30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--fg:#e8ecf5;--card:#171e30;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:800px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
h1{font-size:24px;margin:0;letter-spacing:-.3px}
#rc{margin-left:auto;max-width:460px;flex:1 1 300px;background:var(--card);border:3px solid #ef4444;border-radius:14px;padding:10px 14px;text-align:right;transition:border-color .3s,box-shadow .3s}
#rt{font-size:21px;font-weight:900;line-height:1.15}
#rs{font-size:14px;font-weight:600;margin-top:4px;line-height:1.35}
#lg{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;font-size:12px;font-weight:800}
#lg span{padding:3px 10px;border-radius:99px;border:2px solid transparent;opacity:.45}
#lg span.on{opacity:1}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:14px}
.pill{background:var(--card);padding:5px 12px;border-radius:99px;border:1px solid rgba(128,128,128,.25)}
canvas{width:100%;height:auto;display:block;border-radius:16px;background:#3d5a88;touch-action:none;cursor:pointer;transition:box-shadow .3s}
#msg{margin-top:10px;background:var(--card);border-radius:12px;padding:12px 14px;min-height:64px;font-size:15px;line-height:1.45;border:1px solid rgba(128,128,128,.25)}
button{margin-top:8px;font:inherit;padding:8px 18px;border-radius:10px;border:0;background:#3b82f6;color:#fff;cursor:pointer;display:none}
.ctl{display:inline-block;margin-right:6px;background:#475569;padding:10px 24px;touch-action:manipulation}
.r{color:#ef4444}.b{color:#3b82f6}
</style></head><body><div class="wrap">
<header><h1>Angle Drop</h1>
<div id="rc"><div id="rt"></div><div id="rs"></div>
<div id="lg"><span id="lr" style="color:#ef4444;border-color:#ef4444">● RED: linear pair</span><span id="lb" style="color:#3b82f6;border-color:#3b82f6">● BLUE: vertically opposite</span></div></div></header>
<div class="hud"><span class="pill">Ball <b id="bn">1</b>/10</span><span class="pill" style="color:#22c55e">✓ Correct <b id="sc">0</b></span><span class="pill" style="color:#ef4444">✗ Wrong <b id="wr">0</b></span></div>
<canvas id="c" width="1520" height="1120"></canvas>
<div id="msg"></div>
<div><button class="ctl" id="bl">◀</button><button class="ctl" id="br">▶</button><button class="ctl" id="bd">▼ Drop</button></div>
<button id="again">Play again</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);
const W=760,H=560,S=195,CX=380,CY=340,H0=1.2,RAD=0.85,TOTAL=10,BR=17;
const $=id=>document.getElementById(id);
const P=(x,y,z)=>[CX+(x-z)*0.866*S,CY+(x+z)*0.5*S-y*S];
const D=Math.PI/180;
let through=false,nextRed=true,cur=0,ref=0,n=0,correct=0,wrong=0,soft=false,R,ball,phase='fall',chosen=-1,vy=0,bounces=0,revealed=false,over=false,timer=null;
let ripples=[],parts=[],flash=0,fc='34,197,94';
const stars=Array.from({length:50},()=>[Math.random()*W,Math.random()*H,Math.random()*1.3+.3,Math.random()*6]);
const refPos=()=>{const m=mid(ref);return[.38*Math.cos(m),.38*Math.sin(m)]};
function newRound(){
  const th=[30,40,50,60,70,80,100,110,120,130,140,150][Math.random()*12|0];
  const a=Math.random()*360,r=Math.random()*4|0,red=nextRed;nextRed=!nextRed;
  R={th,a,r,red,ok:red?[(r+1)%4,(r+3)%4]:[(r+2)%4]};
  n++;$('bn').textContent=n;
  ref=r;cur=(r+1+(Math.random()*3|0))%4;soft=false;chosen=-1;revealed=false;bounces=0;vy=0;through=false;phase='fall';ripples=[];parts=[];flash=0;
  ball={x:0.62*Math.cos(mid(cur)),y:H0,z:0.62*Math.sin(mid(cur))};
  const c=red?'#ef4444':'#3b82f6';
  $('rc').style.borderColor=c;$('rc').style.boxShadow='0 0 22px '+(red?'rgba(239,68,68,.4)':'rgba(59,130,246,.4)');
  cv.style.boxShadow='0 0 0 3px '+c+',0 0 28px '+(red?'rgba(239,68,68,.35)':'rgba(59,130,246,.35)');
  $('rt').style.color=c;
  $('rt').textContent=red?'RED BALLS = LINEAR PAIR':'BLUE BALLS = VERTICALLY OPPOSITE';
  $('rs').textContent=red?'Put the ringed ball in an angle next to the other ball’s angle, on a straight line (adds to 180°).':'Put the ringed ball in the angle directly across the crossing point from the other ball’s angle (equal angles).';
  $('lr').className=red?'on':'';$('lb').className=red?'':'on';
  $('msg').innerHTML='Two balls are falling. The other ball stays put (yellow angle). Move the <b>ringed ball</b> to the right angle before they land: <b>tap an angle</b> or use ◀ ▶ (arrow keys). Hold ▼ to drop faster.';
}
const dir=i=>R.a+[0,R.th,180,180+R.th,360][i];
function mid(i){return (dir(i)+dir(i+1))/2*D}
function sectorAt(sx,sy){
  const u=(sx-CX)/(0.866*S),v=(sy-CY)/(0.5*S),x=(u+v)/2,z=(v-u)/2;
  if(Math.hypot(x,z)>RAD+.05)return -1;
  const t=((Math.atan2(z,x)/D-R.a)%360+360)%360;
  return t<R.th?0:t<180?1:t<180+R.th?2:3;
}
function pos(e){const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]}
cv.addEventListener('pointerdown',e=>{
  if(phase!=='fall'||over)return;
  const p=pos(e),s=sectorAt(p[0],p[1]);if(s>=0)cur=s;
});
function judge(){
  revealed=true;phase='result';chosen=cur;
  const good=R.ok.includes(cur);through=good;if(good)vy=-0.3;
  fc=good?'34,197,94':'239,68,68';flash=1;
  [refPos(),[ball.x,ball.z]].forEach(p=>{
    ripples.push({x:p[0],z:p[1],t:0});
    const sp=P(p[0],0,p[1]);
    for(let k=0;k<16;k++){const a=Math.random()*7,s=60+Math.random()*130;parts.push({x:sp[0],y:sp[1],vx:Math.cos(a)*s,vy:-Math.abs(Math.sin(a))*s*1.3,l:1})}
  });
  const why=R.red?'Linear pair: two angles side by side on a straight line, adding up to 180°.':'Vertically opposite angles sit across the crossing point and are equal.';
  if(good){correct++;$('msg').innerHTML='<b style="color:#22c55e">Correct! Both balls fall through the plane.</b> '+why}
  else{wrong++;$('msg').innerHTML='<b style="color:#ef4444">Not quite.</b> '+why+' The glowing green angle was the right one.'}
  $('sc').textContent=correct;$('wr').textContent=wrong;
  if(n>=TOTAL){over=true;$('msg').innerHTML+=`<br><b>Finished!</b> You got ${correct} out of ${TOTAL} correct.`;$('again').style.display='inline-block'}
  else timer=setTimeout(newRound,2800);
}
$('again').onclick=()=>{clearTimeout(timer);n=0;correct=0;wrong=0;nextRed=true;over=false;$('again').style.display='none';$('sc').textContent=0;$('wr').textContent=0;newRound()};
function wedge(i,r){
  const a0=dir(i)*D,a1=dir(i+1)*D;g.beginPath();g.moveTo(...P(0,0,0));
  for(let k=0;k<=18;k++){const t=a0+(a1-a0)*k/18;g.lineTo(...P(r*Math.cos(t),0,r*Math.sin(t)))}
  g.closePath();
}
function label(i){
  const m=mid(i),p=P(.55*Math.cos(m),0,.55*Math.sin(m)),v=i%2?180-R.th:R.th;
  g.font='bold 15px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.lineWidth=4;g.strokeStyle='rgba(10,15,30,.8)';g.strokeText(v+'°',p[0],p[1]);g.fillStyle='#fff';g.fillText(v+'°',p[0],p[1]);
}
function bg(t){
  const gr=g.createRadialGradient(CX,CY,40,CX,CY,520);gr.addColorStop(0,'#7da0cc');gr.addColorStop(1,'#3d5a88');
  g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle='#fff';
  for(const s of stars){g.globalAlpha=.25+.25*Math.sin(t/700+s[3]);g.beginPath();g.arc(s[0],s[1],s[2],0,7);g.fill()}
  g.globalAlpha=1;
}
function plane(){
  const q=[[-1,-1],[1,-1],[1,1],[-1,1]];
  const path=dy=>{g.beginPath();q.forEach((c,k)=>{const p=P(c[0],0,c[1]);k?g.lineTo(p[0],p[1]+dy):g.moveTo(p[0],p[1]+dy)});g.closePath()};
  path(12);g.fillStyle='#8c7d5c';g.fill();
  path(0);const gr=g.createLinearGradient(0,CY-S,0,CY+S);gr.addColorStop(0,'rgba(248,240,222,.94)');gr.addColorStop(1,'rgba(224,210,180,.94)');
  g.fillStyle=gr;g.fill();g.strokeStyle='#b9a982';g.lineWidth=2.5;g.stroke();
  if(flash>0){g.fillStyle=`rgba(${fc},${flash*.3})`;g.fill()}
  g.lineWidth=1;g.strokeStyle='rgba(90,70,30,.13)';
  for(let k=-0.5;k<1;k+=0.5){g.beginPath();g.moveTo(...P(k,0,-1));g.lineTo(...P(k,0,1));g.moveTo(...P(-1,0,k));g.lineTo(...P(1,0,k));g.stroke()}
  for(let i=0;i<4;i++){
    wedge(i,RAD);
    g.fillStyle='rgba(255,255,255,.4)';g.fill();g.strokeStyle='rgba(120,100,60,.35)';g.lineWidth=1.5;g.stroke();
    if(i===ref){g.fillStyle='rgba(245,158,11,.7)';g.fill()}
    if(i===cur&&!revealed){g.fillStyle='rgba(40,60,110,.28)';g.fill();g.strokeStyle='#1e293b';g.lineWidth=2.5;g.stroke()}
    if(revealed&&R.ok.includes(i)){g.shadowColor='#22c55e';g.shadowBlur=18;g.strokeStyle='#22c55e';g.lineWidth=3;g.stroke();g.shadowBlur=0}
    if(revealed&&i===chosen&&!R.ok.includes(i)){g.strokeStyle='#ef4444';g.lineWidth=3;g.stroke()}
  }
  g.lineCap='round';g.strokeStyle='#3b3322';g.lineWidth=5;g.shadowBlur=0;
  for(let k=0;k<2;k++){const t=(R.a+k*R.th)*D;g.beginPath();g.moveTo(...P(-Math.cos(t),0,-Math.sin(t)));g.lineTo(...P(Math.cos(t),0,Math.sin(t)));g.stroke()}
  g.shadowBlur=0;
  label(ref);if(revealed)for(let i=0;i<4;i++)if(i!==ref)label(i);
}
function fx(){
  for(const r of ripples){
    const sp=P(r.x,0,r.z);
    for(let w=0;w<2;w++){
      const t=r.t-w*.18;if(t<=0||t>=1)continue;
      const rx=(.08+t*.5)*S*1.22;
      g.strokeStyle=`rgba(${fc},${(1-t)*.9})`;g.lineWidth=3*(1-t)+1;
      g.beginPath();g.ellipse(sp[0],sp[1],rx,rx*.577,0,0,7);g.stroke();
    }
  }
  for(const p of parts){g.globalAlpha=Math.max(0,p.l);g.fillStyle=`rgb(${fc})`;g.beginPath();g.arc(p.x,p.y,2.5,0,7);g.fill()}
  g.globalAlpha=1;
}
function drawBall(b,t,clip){
  const [bx,bz,mine]=b,y=ball.y,col=R.red?['#fecaca','#ef4444','#7f1d1d']:['#bfdbfe','#3b82f6','#1e3a8a'];
  const a=y<0?Math.max(0,1+y*.9):1;if(a<=0)return;
  const sp=P(bx,0,bz),bp=P(bx,y,bz);
  g.save();g.globalAlpha=a;
  if(clip){g.beginPath();g.rect(0,0,W,sp[1]);g.clip()}
  if(y>0.08){g.setLineDash([5,6]);g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=1.5;g.beginPath();g.moveTo(bp[0],bp[1]);g.lineTo(sp[0],sp[1]);g.stroke();g.setLineDash([])}
  if(y>=0){const k=Math.max(.3,1-y*.35);g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(sp[0],sp[1],BR*k,BR*.47*k,0,0,7);g.fill()}
  if(mine){const h=g.createRadialGradient(bp[0],bp[1],8,bp[0],bp[1],46);h.addColorStop(0,col[1]+'88');h.addColorStop(1,col[1]+'00');g.fillStyle=h;g.beginPath();g.arc(bp[0],bp[1],46,0,7);g.fill()}
  const gr=g.createRadialGradient(bp[0]-6,bp[1]-7,2,bp[0],bp[1],BR+2);
  gr.addColorStop(0,col[0]);gr.addColorStop(.55,col[1]);gr.addColorStop(1,col[2]);
  g.fillStyle=gr;g.beginPath();g.arc(bp[0],bp[1],BR,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.ellipse(bp[0]-5,bp[1]-7,4.5,2.8,-.6,0,7);g.fill();
  if(mine){g.strokeStyle='#1e293b';g.lineWidth=3;g.setLineDash([7,5]);g.lineDashOffset=-t/40;g.beginPath();g.arc(bp[0],bp[1],BR+7,0,7);g.stroke();g.setLineDash([])}
  g.restore();
}
function cut(b){
  const py=Math.abs(ball.y)*S;if(py>=BR)return;
  const sp=P(b[0],0,b[1]),rho=Math.sqrt(BR*BR-py*py);
  g.strokeStyle=R.red?'#ef4444':'#3b82f6';g.lineWidth=2.5;g.shadowColor=g.strokeStyle;g.shadowBlur=10;
  g.beginPath();g.ellipse(sp[0],sp[1],rho*1.22,rho*.7,0,0,7);g.stroke();g.shadowBlur=0;
}
function draw(t){
  g.clearRect(0,0,W,H);bg(t);
  const balls=[[...refPos(),false],[ball.x,ball.z,true]].sort((p,q)=>(p[0]+p[1])-(q[0]+q[1]));
  for(const b of balls)if(ball.y<0)drawBall(b,t,false);
  plane();
  for(const b of balls)if(ball.y<0&&ball.y>-BR/S)cut(b);
  fx();
  for(const b of balls){if(ball.y>=0)drawBall(b,t,false);else if(ball.y>-BR/S)drawBall(b,t,true)}
}
let last=0;
function frame(ts){
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  if(phase==='fall'){
    const tx=0.62*Math.cos(mid(cur)),tz=0.62*Math.sin(mid(cur)),k=Math.min(1,dt*10);
    ball.x+=(tx-ball.x)*k;ball.z+=(tz-ball.z)*k;
    ball.y-=(0.17+n*0.012)*(soft?7:1)*dt;
    if(ball.y<=0.001){ball.y=0.001;vy=0.5;bounces=0;judge()}
  }else if(phase==='result'){
    if(through){vy-=3*dt;ball.y+=vy*dt}
    else if(ball.y>0.001||vy>0){vy-=5*dt;ball.y+=vy*dt;if(ball.y<=0.001){ball.y=0.001;if(bounces<2){vy=-vy*0.4;bounces++}else vy=0}}
  }
  for(const r of ripples)r.t+=dt/1.1;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.l-=dt*1.4}
  flash=Math.max(0,flash-dt*1.6);
  draw(ts);requestAnimationFrame(frame);
}
const mv=d=>{if(phase==='fall')cur=(cur+d+4)%4};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){mv(-1);e.preventDefault()}if(e.key==='ArrowRight'){mv(1);e.preventDefault()}if(e.key==='ArrowDown'||e.key===' '){soft=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowDown'||e.key===' ')soft=false});
$('bl').onclick=()=>mv(-1);$('br').onclick=()=>mv(1);
const sd=$('bd');sd.onpointerdown=()=>soft=true;sd.onpointerup=sd.onpointerleave=()=>soft=false;
newRound();requestAnimationFrame(frame);
</script></body></html>
